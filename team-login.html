<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF Treasure Hunt - Team Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/portal.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        .login-header {
            margin-bottom: 30px;
        }
        
        .login-header h2 {
            color: #ff6200;
            margin-bottom: 10px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        
        .btn-login {
            background-color: #ff6200;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-login:hover {
            background-color: #e55a00;
        }
        
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            display: none;
        }
        
        .back-link {
            margin-top: 20px;
            display: inline-block;
            color: #555;
            text-decoration: none;
        }
        
        .back-link:hover {
            color: #ff6200;
            text-decoration: underline;
        }
    </style>
</head>
<body class="portal-body">
    <div class="login-container">
        <div class="login-header">
            <h2>Team Login</h2>
            <p>Enter your team password to access the challenge portal</p>
        </div>
        
        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="team-password">Team Password</label>
                <input type="password" id="team-password" name="password" required>
            </div>
            
            <button type="submit" class="btn-login">Login</button>
            
            <div id="error-message" class="error-message">
                Incorrect password. Please try again.
            </div>
        </form>
        
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Main Page
        </a>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            
            // Get team ID from URL path
            const pathSegments = window.location.pathname.split('/');
            const teamId = pathSegments[pathSegments.length - 1];
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password = document.getElementById('team-password').value;
                
                // Verify team credentials against the database
                fetch(`/api/teams/${teamId}/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Store team info in session storage
                            const team = {
                                id: teamId,
                                name: data.name,
                                score: data.score,
                                completedChallenges: data.completedChallenges || []
                            };
                            // Store team info in session storage
                            sessionStorage.setItem('currentTeam', JSON.stringify(team));
                            
                            // Redirect to challenge portal
                            window.location.href = `/challenge-portal.html?team=${teamId}`;
                        } else {
                            // Show error message
                            errorMessage.style.display = 'block';
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching teams data:', error);
                        showError('An error occurred. Please try again.', 'Error');
                        errorMessage.textContent = 'An error occurred. Please try again.';
                        errorMessage.style.display = 'block';
                    });
            });
        });
    </script>
    <script src="js/modal.js"></script>
</body>
</html>

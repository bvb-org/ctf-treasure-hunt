name: Deploy to Raspberry Pi

on:
  workflow_dispatch:  # Manual trigger from GitHub UI
  push:  # Trigger on any push to any branch

env:
  DOCKER_IMAGE: ing-treasure-hunt
  DB_VOLUME_NAME: treasure-hunt-db  # Volume for database persistence

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[ci]')

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

      - name: Create database volume if it doesn't exist
        run: |
          # Check if volume exists, create if it doesn't
          if ! docker volume inspect ${{ env.DB_VOLUME_NAME }} &>/dev/null; then
            docker volume create ${{ env.DB_VOLUME_NAME }}
          fi

      - name: Deploy new container
        run: |
          # Stop and remove the existing container (ignore errors if it doesn't exist)
          docker stop ${{ env.DOCKER_IMAGE }} || true
          docker rm ${{ env.DOCKER_IMAGE }} || true
          
          # Run the new container with Docker volume for database persistence
          docker run -d \
            --name ${{ env.DOCKER_IMAGE }} \
            --restart unless-stopped \
            -p 3123:3123 \
            -v ${{ env.DB_VOLUME_NAME }}:/app/data \
            -e DB_PATH=/app/data/treasure_hunt.db \
            ${{ env.DOCKER_IMAGE }}:latest